server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Application React : toute adresse inconnue renvoie l'écran principal
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers compilés : noms uniques, cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
