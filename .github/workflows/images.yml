name: Images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    env:
      IMAGE: ghcr.io/kanimbahub/kuma-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:${{ github.sha }}" ${{ matrix.app }}

      - name: Analyse de sécurité (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"

      - name: Publier sur ghcr.io
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
