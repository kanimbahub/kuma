name: kuma-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: kuma-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/kuma/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: kuma-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - /var/lib/kuma/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:24-alpine
    container_name: kuma-dev-backend
    restart: unless-stopped
    user: "${KUMA_UID}:${KUMA_GID}"
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm ci; npm run start:dev"
    environment:
      HOME: /tmp
      NODE_ENV: development
      PORT: "3000"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ../backend:/app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    container_name: kuma-dev-frontend
    restart: unless-stopped
    user: "${KUMA_UID}:${KUMA_GID}"
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm ci; npm run dev -- --host 0.0.0.0"
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

networks:
  default:
    name: kuma-dev-net
